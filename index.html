<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klasemen Serasa</title>
<meta name="description" content="Liga Serasa periode 2024 - 2027. Klasemen status pacaran, PDKT, dan jomblo.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#1A1A1D;--surface:#222226;--ink:#F2F2F4;--muted:#A3A3A8;--line:#4E4E50;--accent:#C3073F;
--pacaran:#39FF14;--pdkt:#FF7A00;--jomblo:#FF1F4B;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-theme="light"]{color-scheme:light;--bg:#F5F4F6;--surface:#FFFFFF;--ink:#1A1A1D;--muted:#5E5E63;--line:#D3D3D8;--accent:#C3073F;--pacaran:#10B300;--pdkt:#F26A00;--jomblo:#E0123D}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;min-height:100%}
body,.hero,.scroll,.divisi,.tbtn{transition:background-color .3s,color .3s,border-color .3s}
main{max-width:760px;margin:0 auto;padding:56px 20px 72px}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;padding:36px 24px 28px;margin-bottom:36px;background:var(--surface)}
.hero>*{position:relative}
.hero>.herobg{position:absolute;inset:0;background:url("foto-grup.jpg") center/cover no-repeat;opacity:.4}
h1{font-weight:800;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.05;letter-spacing:-.03em;margin:0 0 12px;color:var(--accent);min-height:1.1em}
#ketik::after{content:"";display:inline-block;width:.07em;height:.85em;margin-left:.08em;background:var(--accent);vertical-align:-.06em;animation:kursor .8s step-end infinite}
@keyframes kursor{50%{opacity:0}}
.lead{font-size:1.1rem;color:var(--muted);margin:0;max-width:56ch}
.divisi{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--surface);border-radius:6px;margin-bottom:40px}
.divisi div{padding:20px 18px;border-right:1px solid var(--line)}
.divisi div:last-child{border-right:0}
.divisi b{display:block;font-size:2.4rem;font-weight:700;line-height:1;text-shadow:0 0 14px currentColor}
.divisi span{display:block;font-size:.9rem;color:var(--muted);margin-top:6px}
.divisi i{display:block;height:3px;margin-top:14px;border-radius:2px}
h2{font-size:1.4rem;font-weight:700;margin:0 0 14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:420px}
th{font-weight:500;font-size:.85rem;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:13px 16px;vertical-align:middle}
td.no{width:52px;font-size:1.15rem;color:var(--muted)}
td.nama{font-weight:600}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:.9rem}
.badge::before{content:"";width:11px;height:11px;border-radius:50%;background:currentColor;box-shadow:0 0 6px 1px currentColor,0 0 16px 4px currentColor}
.badge span{color:var(--ink)}
.s-pacaran{color:var(--pacaran)}.s-pdkt{color:var(--pdkt)}.s-jomblo{color:var(--jomblo)}
.badge.s-pacaran::before{animation:napas 2.6s ease-in-out infinite}
.badge.s-pdkt::before{animation:kedip 1s ease-in-out infinite}
.badge.s-jomblo::before{animation:kelip 3.2s linear infinite}
@keyframes napas{0%,100%{opacity:1;box-shadow:0 0 6px 1px currentColor,0 0 18px 5px currentColor}50%{opacity:.55;box-shadow:0 0 3px 0 currentColor,0 0 6px 1px currentColor}}
@keyframes kedip{0%,100%{opacity:1;box-shadow:0 0 8px 2px currentColor,0 0 20px 6px currentColor}50%{opacity:.15;box-shadow:none}}
@keyframes kelip{0%,100%{opacity:1}8%{opacity:.2}12%{opacity:1}20%{opacity:.4}24%{opacity:1}60%{opacity:1}64%{opacity:.15}68%{opacity:.9}72%{opacity:.25}76%,99%{opacity:1}}
tr.r-pacaran td{border-bottom:2px solid var(--pacaran);box-shadow:0 2px 10px -6px var(--pacaran)}
tr.r-pdkt td{border-bottom:2px solid var(--pdkt);box-shadow:0 2px 10px -6px var(--pdkt)}
tr.r-jomblo td{border-bottom:2px solid var(--jomblo);box-shadow:0 2px 10px -6px var(--jomblo)}
tr.r-pacaran td.no{box-shadow:inset 4px 0 var(--pacaran)}
tr.r-pdkt td.no{box-shadow:inset 4px 0 var(--pdkt)}
tr.r-jomblo td.no{box-shadow:inset 4px 0 var(--jomblo)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.tbtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 12px -4px rgba(0,0,0,.4)}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.badge::before{animation:none!important}#ketik::after{display:none}}
@media(max-width:520px){.divisi b{font-size:1.9rem}.divisi div{padding:16px 12px}main{padding-top:40px}}
</style>
</head>
<body>
<button id="tbtn" class="tbtn" type="button"></button>
<main>
  <header class="hero">
    <div class="herobg"></div>
    <h1 aria-label="Klasemen Serasa"><span id="ketik">Klasemen Serasa</span></h1>
    <p class="lead">Liga Serasa periode 2024 - 2027. Liga ini mempertaruhkan harga diri anggota. Setelah masa periode selesai, anggota yang masih berstatus J (jomblo) dikeluarkan dari grup Serasa.</p>
  </header>
  <section class="divisi" id="divisi" aria-label="Ringkasan per kategori"></section>
  <h2>Urutan nama</h2>
  <div class="scroll"><table>
    <thead><tr><th>#</th><th>Nama</th><th>Status</th><th>Lama (bulan)</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</main>
<script src="data.js"></script>
<script>
(function(){
  var LABEL={pacaran:'Pacaran',pdkt:'PDKT',jomblo:'Jomblo'},ORDER={pacaran:1,pdkt:2,jomblo:3};
  function $(id){return document.getElementById(id);}
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}

  /* ---- Data & tabel ---- */
  var data=(window.ANGGOTA||[]).map(function(x){return {n:String(x.n||''),s:ORDER[x.s]?x.s:'jomblo',m:Number(x.m)||0};});
  data.sort(function(a,b){return ORDER[a.s]-ORDER[b.s]||b.m-a.m||a.n.localeCompare(b.n);});
  var total=data.length||1,h='';
  ['pacaran','pdkt','jomblo'].forEach(function(k){
    var c=data.filter(function(x){return x.s===k;}).length;
    h+='<div><b class="s-'+k+'">'+c+'</b><span>'+LABEL[k]+'</span><i style="background:var(--'+k+');width:'+Math.round(c/total*100)+'%"></i></div>';
  });
  $('divisi').innerHTML=h;
  var rows='';
  data.forEach(function(x,i){
    rows+='<tr class="r-'+x.s+'"><td class="no">'+(i+1)+'</td><td class="nama">'+esc(x.n)+'</td><td><span class="badge s-'+x.s+'"><span>'+LABEL[x.s]+'</span></span></td><td>'+x.m+'</td></tr>';
  });
  $('tbody').innerHTML=rows||'<tr><td colspan="4" class="empty">Belum ada data.</td></tr>';

  /* ---- Mode gelap / terang ---- */
  var SUN='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
  var MOON='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  var theme='dark';
  try{theme=localStorage.getItem('sa-theme')==='light'?'light':'dark';}catch(e){}
  function applyTheme(){
    document.documentElement.setAttribute('data-theme',theme);
    var b=$('tbtn');
    b.innerHTML=theme==='dark'?SUN:MOON;
    b.setAttribute('aria-label',theme==='dark'?'Ganti ke mode terang':'Ganti ke mode gelap');
  }
  $('tbtn').addEventListener('click',function(){
    theme=theme==='dark'?'light':'dark';
    try{localStorage.setItem('sa-theme',theme);}catch(e){}
    applyTheme();
  });
  applyTheme();

  /* ---- Animasi mengetik berulang (jeda 2 detik) ---- */
  (function(){
    var el=$('ketik'),full='Klasemen Serasa',i=0,dir=1;
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    el.textContent='';
    function t(){
      el.textContent=full.slice(0,i);
      if(dir===1){
        if(i<full.length){i++;setTimeout(t,110+Math.random()*90);}
        else{dir=-1;setTimeout(t,2000);}
      }else{
        if(i>0){i--;setTimeout(t,50);}
        else{dir=1;setTimeout(t,500);}
      }
    }
    setTimeout(t,300);
  })();
})();
</script>
</body>
</html>
